# Render reads this file to set up Sage from your GitHub repo.
# See the "Put it online" section of the README.
services:
  - type: web
    name: sage-tutor
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false # Render asks you for this when you set it up
      - key: ACCESS_CODES
        sync: false
      - key: DAILY_BUDGET_USD
        value: "3"
      - key: DAILY_MESSAGES_PER_FRIEND
        value: "150"
